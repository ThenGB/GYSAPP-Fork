allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate {
        if (it.hasProperty('android')) {
            if (it.android.namespace == null) {
                it.android.namespace = namespaceFromManifest(it)
            }

            android {
                compileSdk = 36

                defaultConfig {
                    targetSdk = 35
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                packaging {
                    jniLibs {
                        useLegacyPackaging = true
                    }
                }
            }

            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = JavaVersion.VERSION_17.toString()
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

def namespaceFromManifest(project) {
    def manifestFile = project.android.sourceSets.main.manifest.srcFile
    if (!manifestFile.exists()) {
        return fallbackNamespace(project)
    }

    def matcher = manifestFile.text =~ /package="([^"]+)"/
    def packageName = matcher.find() ? matcher.group(1) : null
    return packageName ?: fallbackNamespace(project)
}

def fallbackNamespace(project) {
    def groupName = project.group?.toString()
    if (groupName) return groupName
    return project.name.replace('-', '_')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
