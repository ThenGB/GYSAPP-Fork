plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties['storeFile'] &&
        keystoreProperties['keyAlias'] &&
        keystoreProperties['keyPassword'] &&
        keystoreProperties['storePassword']

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "com.itmandiri.church"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "id.sch.kanaan.egys"
        minSdk = 24
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        resConfigs "en", "id", "zh"
        manifestPlaceholders += [
            'appAuthRedirectScheme': 'com.googleusercontent.apps.705603488262-nngndk9jgsqjtn9uaadg5aqmtrcl5l5h'
        ]
        ndk {
            abiFilters "arm64-v8a"
        }

    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Never substitute the debug key for a release build. If the
            // official release keystore is unavailable, Gradle emits a genuine
            // unsigned release APK; CI labels that artifact explicitly.
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // Enable R8 full mode for more aggressive code shrinking.  Full mode
    // performs additional optimisations (e.g. more aggressive class
    // merging) that trade a small amount of build time for smaller APKs.
    // Safe with our proguard rules because the Flutter embedding, the
    // native PDF / MIDI plugins and the authentication plugins all have
    // their symbols explicitly kept.
    // Note: this property is only honoured by AGP 8.x; for older AGP it
    // is a no-op.
}

flutter {
    source = '../..'
}
