org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx2048M
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
org.gradle.caching=true
org.gradle.parallel=true
android.builtInKotlin=true

# Only build for arm64-v8a
android.nativeBuild.abiFilters=arm64-v8a
# The Flutter Gradle plugin reads this property to decide which libapp.so /
# libflutter.so platforms to build and package. Without it, every release
# APK bundled armeabi-v7a + x86_64 builds as well (~35 MB of dead weight
# on arm64-only devices).
target-platform=android-arm64
# Without this, the Flutter Gradle plugin CLEARS the abiFilters in
# app/build.gradle and re-adds every platform ABI, so third-party plugin
# .so files (soloud audio codecs, dartjni, datastore) for armeabi-v7a and
# x86_64 were still packaged. With it, the app's own
# `ndk { abiFilters "arm64-v8a" }` is honored and the APK is arm64-only.
disable-abi-filtering=true

# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
