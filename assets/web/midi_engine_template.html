<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI Engine</title>
  <style>
    body { margin: 0; padding: 8px; font-family: sans-serif; font-size: 12px; background: #1a1a1a; color: #fff; }
    #status { padding: 4px; }
  </style>
</head>
<body>
  <div id="status">Loading MIDI Engine...</div>

  <script>
    // ─── Worker Blob Setup ─────────────────────────────────────────────
    // On Windows, WebView2 blocks Workers from file:// URLs (null origin).
    // We embed the worker code as a base64 string, decode it at runtime,
    // and create a Blob URL that bypasses the origin restriction.
    (function() {
      var _b64 = 'WORKER_BASE64_PLACEHOLDER';

      function _decodeWorkerCode() {
        var binary = atob(_b64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      }

      // Primary: create blob URL immediately
      try {
        var code = _decodeWorkerCode();
        var blob = new Blob([code], { type: 'application/javascript' });
        window._midiWorkerBlobUrl = URL.createObjectURL(blob);
      } catch (e) {
        console.error('[MidiEngine] Failed to create worker blob:', e);
      }

      // Fallback: create worker on-demand (used by midi-engine.js if blob URL fails)
      window._midiWorkerFallbackCreate = function() {
        var code = _decodeWorkerCode();
        var blob = new Blob([code], { type: 'application/javascript' });
        var url = URL.createObjectURL(blob);
        return new Worker(url);
      };

      // Last-resort fallback: data URL (some WebView2 versions block blob Workers)
      window._midiWorkerDataUrlCreate = function() {
        var dataUrl = 'data:application/javascript;base64,' + _b64;
        return new Worker(dataUrl);
      };
    })();
  </script>

  <script>
MIDI_ENGINE_CODE_PLACEHOLDER
  </script>

  <script>
    // ─── Flutter Bridge ────────────────────────────────────────────────
    // Expose a global API that the Flutter side can call via evaluateJavascript
    // and receive events via flutter_inappwebview.callHandler.

    window.FlutterMidiBridge = {
      engine: null,
      _state: {
        isPlaying: false,
        isLoading: false,
        position: 0,
        duration: 0,
        loadProgress: 0,
        currentSong: null
      },
      _ready: false,
      _initPromise: null,
      _stateTimer: null,

      async init(soundFontUrl) {
        if (this._ready) {
          this._notifyReady();
          return true;
        }
        if (this._initPromise) return this._initPromise;
        this._initPromise = this._init(soundFontUrl);
        return this._initPromise;
      },

      async _init(soundFontUrl) {
        try {
          this.engine = MidiEngine;
          await this.engine.init(soundFontUrl || 'GeneralUser-GS.sf2', {
            onStateChange: (playing, time, duration) => {
              this._state.isPlaying = playing;
              this._state.position = time;
              this._state.duration = duration;
              if (playing) {
                this._startStateTicker();
              } else {
                this._stopStateTicker();
              }
              this._notifyState();
            },
            onProgress: (percent) => {
              this._state.loadProgress = percent;
              this._notifyState();
            },
            onSongEnd: () => {
              this._state.isPlaying = false;
              this._state.position = this._state.duration;
              this._notifyState();
              if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('midiSongEnd', {});
              }
            }
          });
          this._ready = true;
          this._updateStatus('MIDI Engine Ready');
          this._notifyState();
          this._notifyReady();
          this._notifyInstruments();
          return true;
        } catch (err) {
          this._updateStatus('Error: ' + err.message);
          console.error('MIDI Engine init error:', err);
          this._notifyError(err);
          return false;
        } finally {
          this._initPromise = null;
        }
      },

      async loadMidi(url, options) {
        if (!this._ready || !this.engine) {
          this._notifyError(new Error('MIDI engine is not ready'));
          return;
        }
        this._state.isLoading = true;
        this._state.currentSong = url;
        this._notifyState();
        try {
          if (options.tempoBpm) {
            this.engine.setTempoBpm(options.tempoBpm, { skipApply: true });
          }
          await this.engine.loadMidi(url, {
            transpose: options.transpose || 0,
            instrument: options.instrument || -1,
            autoplay: options.autoplay || false
          });
          this._state.isLoading = false;
          this._state.duration = this.engine.getDuration() || 0;
          this._notifyState();
        } catch (err) {
          this._state.isLoading = false;
          this._updateStatus('Load error: ' + err.message);
          console.error('Load MIDI error:', err);
          this._notifyError(err);
          this._notifyState();
        }
      },

      async play() {
        if (!this.engine) return;
        try {
          await this.engine.play();
          this._state.isPlaying = this.engine.isPlaying();
          this._startStateTicker();
          this._notifyState();
        } catch (err) {
          this._notifyError(err);
        }
      },

      async pause() {
        if (!this.engine) return;
        try {
          await this.engine.pause();
          this._state.isPlaying = false;
          this._stopStateTicker();
          this._notifyState();
        } catch (err) {
          this._notifyError(err);
        }
      },

      async stop() {
        if (!this.engine) return;
        try {
          await this.engine.stop();
          this._state.isPlaying = false;
          this._state.position = 0;
          this._stopStateTicker();
          this._notifyState();
        } catch (err) {
          this._notifyError(err);
        }
      },

      async seek(seconds) {
        if (!this.engine) return;
        try {
          await this.engine.seek(seconds);
          this._state.position = seconds;
          this._notifyState();
        } catch (err) {
          this._notifyError(err);
        }
      },

      async setTranspose(semitones) {
        if (!this.engine) return;
        try {
          await this.engine.setTranspose(semitones);
          this._notifyState();
        } catch (err) {
          this._notifyError(err);
        }
      },

      async setTempoBpm(bpm) {
        if (!this.engine) return;
        try {
          await this.engine.setTempoBpm(bpm);
          this._notifyState();
        } catch (err) {
          this._notifyError(err);
        }
      },

      async setInstrument(program) {
        if (!this.engine) return;
        try {
          await this.engine.setInstrument(program);
          this._notifyState();
        } catch (err) {
          this._notifyError(err);
        }
      },

      setVolume(volume) {
        if (!this.engine) return;
        this.engine.setVolume(volume);
      },

      async changeSoundFont(url) {
        if (!this.engine) return;
        try {
          this._state.isLoading = true;
          this._notifyState();
          await this.engine.changeSoundFont(url);
          this._state.isLoading = false;
          this._notifyInstruments();
          this._notifyState();
        } catch (err) {
          this._state.isLoading = false;
          this._notifyError(err);
          this._notifyState();
        }
      },

      preload(url, options = {}) {
        if (!this.engine) return;
        this.engine.preload(url, options);
      },

      async loadMidiFromBase64(base64, options) {
        const dataUrl = 'data:audio/midi;base64,' + base64;
        return this.loadMidi(dataUrl, options);
      },

      preloadFromBase64(base64, transpose, instrument) {
        const dataUrl = 'data:audio/midi;base64,' + base64;
        this.preload(dataUrl, { transpose, instrument });
      },

      destroy() {
        if (!this.engine) return;
        this._stopStateTicker();
        this.engine.destroy();
        this._ready = false;
      },

      getState() {
        return {
          ...this._state,
          position: this.engine ? this.engine.getTime() : 0,
          duration: this.engine ? this.engine.getDuration() : 0,
          isPlaying: this.engine ? this.engine.isPlaying() : false,
          isLoading: this.engine ? this.engine.isLoading() : false
        };
      },

      _notifyState() {
        const state = this.getState();
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('midiStateChanged', state);
        }
      },

      _startStateTicker() {
        if (this._stateTimer) return;
        this._stateTimer = window.setInterval(() => {
          if (!this.engine) return;
          this._notifyState();
          if (!this.engine.isPlaying()) {
            this._stopStateTicker();
          }
        }, 250);
      },

      _stopStateTicker() {
        if (!this._stateTimer) return;
        window.clearInterval(this._stateTimer);
        this._stateTimer = null;
      },

      _notifyReady() {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('midiReady', {});
        }
      },

      _notifyError(error) {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler(
            'midiError',
            String(error && error.message ? error.message : error)
          );
        }
      },

      _updateStatus(text) {
        const el = document.getElementById('status');
        if (el) el.textContent = text;
      },

      _notifyInstruments() {
        if (!this.engine) return;
        const instruments = this.engine.getInstruments ? this.engine.getInstruments() : [];
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('midiInstrumentsUpdated', instruments);
        }
      }
    };

    window.dispatchEvent(new Event('flutter-midi-bridge-ready'));
  </script>
</body>
</html>
