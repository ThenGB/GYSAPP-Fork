# dart run flutter_native_splash:create --path=flutter_native_splash.yaml
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#002E47"  
  image: assets/images/splashicon-light.png
  image_dark: assets/images/splashicon-dark.png
  android: true
  ios: true
  web: true  
  # image_dark: assets/images/splash_icon_dark.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#002E47"  
    image: assets/images/splashicon-light.png
    image_dark: assets/images/splashicon-dark.png
  # branding: assets/images/branding.png
  branding_mode: bottom
  # image_android: assets/images/splash_icon_android.png
  # image_ios: assets/images/splash_icon_ios.png
  # image_web: assets/images/splash_icon_web.png
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center
  fullscreen: true