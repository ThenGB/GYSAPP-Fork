name: One-shot phase one hardening

on:
  push:
    branches:
      - agent/cross-platform-auth-viewer-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-platform-auth-viewer-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Patch sidebar, MIDI gestures, and diagnostics
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          dashboard = 'lib/presentations/dashboard/view/dashboard_view.dart'
          text = Path(dashboard).read_text(encoding='utf-8-sig')
          old = "    final colors = context.colorScheme;\n    return Padding(\n"
          if old in text:
              text = text.replace(old, "    final colors = context.colorScheme;\n    final memberType = state.account?.resolvedMemberType;\n    final branchName = state.account?.resolvedBranchName;\n    return Padding(\n", 1)
          text = text.replace(
              "                if (state.isLoggedIn &&\n                    ((state.account?.memberType ?? '').isNotEmpty ||\n                        (state.account?.branchName ?? '').isNotEmpty)) ...[",
              "                if (state.isLoggedIn &&\n                    ((memberType ?? '').isNotEmpty ||\n                        (branchName ?? '').isNotEmpty)) ...[",
          )
          text = text.replace(
              "                        state.account?.memberType,\n                        _formatBranchName(state.account?.branchName ?? ''),",
              "                        memberType,\n                        _formatBranchName(branchName ?? ''),",
          )
          text = text.replace(
              "                  Text(\n                    'not_logged_in'.tr(),",
              "                  Text(\n                    state.isLoggedIn\n                        ? (state.account?.email?.trim().isNotEmpty == true\n                              ? state.account!.email!\n                              : 'Akun GYS')\n                        : 'not_logged_in'.tr(),",
          )
          Path(dashboard).write_text(text, encoding='utf-8')

          midi = 'lib/presentations/song/widgets/draggable_midi_controls.dart'
          replace(
              midi,
              "                    return Positioned(\n                      key: const ValueKey('midi-positioned'),\n                      left: position.dx,\n                      bottom: position.dy,\n                      child: GestureDetector(\n                        onTap: _handleTap,\n                        onPanStart: _handlePanStart,\n                        onPanUpdate: _handlePanUpdate,\n                        onPanEnd: _handlePanEnd,",
              "                    final canInteractWithDock =\n                        _animationState == MidiPlayerAnimationState.sidebar_circle ||\n                        _animationState == MidiPlayerAnimationState.flying_to_sidebar;\n                    return Positioned(\n                      key: const ValueKey('midi-positioned'),\n                      left: position.dx,\n                      bottom: position.dy,\n                      child: GestureDetector(\n                        onTap: canInteractWithDock ? _handleTap : null,\n                        onPanStart: canInteractWithDock ? _handlePanStart : null,\n                        onPanUpdate: canInteractWithDock ? _handlePanUpdate : null,\n                        onPanEnd: canInteractWithDock ? _handlePanEnd : null,",
          )

          injection = 'lib/di/injection.dart'
          p = Path(injection)
          text = p.read_text(encoding='utf-8-sig')
          marker = 'final InterceptorsWrapper loggingInterceptor = InterceptorsWrapper('
          start = text.find(marker)
          if start < 0:
              raise SystemExit('logging interceptor marker not found')
          replacement = '''final InterceptorsWrapper loggingInterceptor = InterceptorsWrapper(\n            onError: (error, handler) {\n              if (kDebugMode) {\n                final request = error.requestOptions;\n                log(\n                  '${request.method} ${request.path} -> ${error.response?.statusCode ?? 'network error'}',\n                  name: 'HTTP ERROR',\n                );\n              }\n              return handler.next(error);\n            },\n            onRequest: (options, handler) {\n              if (kDebugMode) {\n                log('${options.method} ${options.path}', name: 'HTTP REQUEST');\n              }\n              return handler.next(options);\n            },\n            onResponse: (response, handler) {\n              if (kDebugMode) {\n                log(\n                  '${response.requestOptions.method} ${response.requestOptions.path} -> ${response.statusCode}',\n                  name: 'HTTP RESPONSE',\n                );\n              }\n              return handler.next(response);\n            },\n          );\n'''
          p.write_text(text[:start] + replacement, encoding='utf-8')

      - name: Add focused account tests
        shell: bash
        run: |
          cat > test/account_role_normalization_test.dart <<'DART'
          import 'package:church/domain/entity/account/account_entity.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            group('Account role normalization', () {
              test('explicit member type wins', () {
                const account = Account(memberType: 'Jemaat', baptized: false);
                expect(account.resolvedMemberType, 'Jemaat');
              });

              test('baptized false resolves to Simpatisan', () {
                const account = Account(baptized: 0);
                expect(account.resolvedMemberType, 'Simpatisan');
              });

              test('baptized true resolves to Jemaat', () {
                const account = Account(baptized: 'sudah dibaptis');
                expect(account.resolvedMemberType, 'Jemaat');
              });

              test('branch metadata normalizes across payload variants', () {
                const account = Account(wilayah: 'Pontianak');
                expect(account.resolvedBranchName, 'Pontianak');
              });
            });
          }
          DART

      - name: Format and validate
        run: |
          dart format lib/presentations/auth/view/login_view.dart lib/domain/entity/account/account_entity.dart lib/data/repository/account_repository_impl.dart lib/presentations/dashboard/view/dashboard_view.dart lib/presentations/song/widgets/draggable_midi_controls.dart lib/di/injection.dart test/account_role_normalization_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub test/account_role_normalization_test.dart test/midi_controls_layout_test.dart test/modernization_hygiene_test.dart test/source_hygiene_test.dart
          flutter build web --release --no-pub

      - name: Commit validated patch
        run: |
          rm -f .github/workflows/one_shot_interaction_security_patch.yml
          rm -f .github/workflows/one_shot_phase1_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden auth, account metadata, and MIDI interaction"
          git push origin HEAD:agent/cross-platform-auth-viewer-hardening
