name: Diagnose Bible Sidebar

on:
  push:
    branches:
      - 'agent/app-modernization-audit'
    paths:
      - '.github/workflows/diagnose_bible_sidebar.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Inject RenderFlex diagnostics locally
        shell: python
        run: |
          from pathlib import Path
          path = Path('test/presentations/bible/widgets/bible_audio_sidebar_test.dart')
          source = path.read_text(encoding='utf-8')
          old = "    expect(tester.takeException(), isNull);"
          new = """    final exception = tester.takeException();
    if (exception is FlutterError) {
      // ignore: avoid_print
      print('=== COMPACT SIDEBAR FLUTTER ERROR ===');
      for (final diagnostic in exception.diagnostics) {
        // ignore: avoid_print
        print(diagnostic.toStringDeep());
      }
      // ignore: avoid_print
      print('=== END COMPACT SIDEBAR ERROR ===');
    }
    expect(exception, isNull);"""
          if old not in source:
              raise SystemExit('Target expectation not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Run compact sidebar test only
        run: flutter test test/presentations/bible/widgets/bible_audio_sidebar_test.dart --plain-name 'compact viewport has no overflow or hit-test warning'
