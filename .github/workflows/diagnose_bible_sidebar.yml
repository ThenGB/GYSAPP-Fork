name: Fix Diagnosed Bible Sidebar Overflow

on:
  push:
    branches:
      - 'agent/app-modernization-audit'
    paths:
      - '.github/workflows/diagnose_bible_sidebar.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Constrain range title inside compact card
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/presentations/bible/widgets/bible_audio_sidebar.dart')
          source = path.read_text(encoding='utf-8')
          old = '''              Text(\n                'bible_range_title'.tr(),\n                style: context.textTheme.labelLarge?.copyWith(\n                  fontWeight: FontWeight.w800,\n                ),\n              ),'''
          new = '''              Expanded(\n                child: Text(\n                  'bible_range_title'.tr(),\n                  maxLines: 1,\n                  overflow: TextOverflow.ellipsis,\n                  style: context.textTheme.labelLarge?.copyWith(\n                    fontWeight: FontWeight.w800,\n                  ),\n                ),\n              ),'''
          if old not in source:
              raise SystemExit('Range title block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Verify compact sidebar only
        run: flutter test test/presentations/bible/widgets/bible_audio_sidebar_test.dart --plain-name "compact viewport has no overflow or hit-test warning"

      - name: Commit verified fix and remove diagnostic workflow
        run: |
          rm .github/workflows/diagnose_bible_sidebar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Bible audio range title overflow"
          git push origin HEAD:${GITHUB_REF_NAME}
