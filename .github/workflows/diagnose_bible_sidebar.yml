name: Diagnose Bible Sidebar

on:
  push:
    branches:
      - 'agent/app-modernization-audit'
    paths:
      - '.github/workflows/diagnose_bible_sidebar.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Let Flutter print the original overflow diagnostics
        run: |
          sed -i "s/    expect(tester.takeException(), isNull);/    \/\/ diagnostic run: leave Flutter layout errors unconsumed/" test/presentations/bible/widgets/bible_audio_sidebar_test.dart

      - name: Run compact sidebar test only
        run: flutter test test/presentations/bible/widgets/bible_audio_sidebar_test.dart --plain-name "compact viewport has no overflow or hit-test warning"
