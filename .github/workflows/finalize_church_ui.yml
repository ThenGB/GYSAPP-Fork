name: Finalize Church UI

on:
  push:
    branches:
      - agent/church-design-system-release-pipeline
    paths:
      - '.github/workflows/finalize_church_ui.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/church-design-system-release-pipeline
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply dashboard polish
        run: python3 .github/scripts/finalize_church_ui.py

      - name: Regenerate native splash resources
        run: dart run flutter_native_splash:create --path=flutter_native_splash.yaml

      - name: Format dashboard
        run: dart format lib/presentations/dashboard/view/dashboard_view.dart

      - name: Commit generated resources and polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize_church_ui.yml
          git rm .github/scripts/finalize_church_ui.py
          git add android ios web lib/presentations/dashboard/view/dashboard_view.dart
          git commit -m "Finalize branded loading and native splash"
          git push origin HEAD:agent/church-design-system-release-pipeline
