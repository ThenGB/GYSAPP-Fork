name: Fix Compact Audio Settings Button

on:
  push:
    branches:
      - 'agent/app-modernization-audit'
    paths:
      - '.github/workflows/fix_bible_settings_button.yml'

permissions:
  contents: write

jobs:
  patch-sidebar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Make settings shortcut label flexible
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/presentations/bible/widgets/bible_audio_sidebar.dart')
          source = path.read_text(encoding='utf-8')
          old = '''                OutlinedButton.icon(\n                  onPressed: onOpenSettings,\n                  icon: const Icon(Icons.tune_rounded, size: 18),\n                  label: Text('audio_settings_shortcut'.tr()),\n                ),'''
          new = '''                OutlinedButton(\n                  onPressed: onOpenSettings,\n                  child: Row(\n                    mainAxisAlignment: MainAxisAlignment.center,\n                    children: [\n                      const Icon(Icons.tune_rounded, size: 18),\n                      const SizedBox(width: 8),\n                      Flexible(\n                        child: Text(\n                          'audio_settings_shortcut'.tr(),\n                          maxLines: 1,\n                          overflow: TextOverflow.ellipsis,\n                        ),\n                      ),\n                    ],\n                  ),\n                ),'''
          if old not in source:
              raise SystemExit('Expected settings button block was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix_bible_settings_button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Bible audio settings shortcut responsive"
          git push origin HEAD:${GITHUB_REF_NAME}
