name: One-shot security and reader UI hardening

on:
  push:
    branches:
      - agent/cross-platform-auth-viewer-hardening

permissions:
  contents: write

concurrency:
  group: one-shot-security-reader-ui
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-platform-auth-viewer-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply security and UI patch
        run: |
          python .github/scripts/phase3_security_ui.py
          python .github/scripts/phase3_translation_fix.py

      - name: Format source
        run: dart format lib/data/services/auth_token_store.dart lib/presentations/dashboard/cubit/dashboard_cubit.dart lib/di/injection.dart lib/presentations/bible/view/bible_view.dart test/security_hygiene_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused regression tests
        run: flutter test --no-pub test/security_hygiene_test.dart test/modernization_hygiene_test.dart test/midi_controls_layout_test.dart test/song_pdf_viewer_contract_test.dart test/song/chord_text_layout_test.dart

      - name: Build web release
        run: flutter build web --release --no-pub

      - name: Commit validated changes
        run: |
          rm .github/workflows/one_shot_security_ui_patch.yml
          rm .github/scripts/phase3_security_ui.py
          rm .github/scripts/phase3_translation_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Secure auth persistence and polish reader UI"
          git push origin HEAD:agent/cross-platform-auth-viewer-hardening
