name: One-shot Web runtime hardening

on:
  push:
    branches:
      - agent/cross-platform-auth-viewer-hardening

permissions:
  contents: write

concurrency:
  group: one-shot-web-runtime-hardening
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-platform-auth-viewer-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply Web runtime patch
        run: python .github/scripts/phase4_web_runtime.py

      - name: Format
        run: dart format lib/data/services/auth_session_credential.dart lib/presentations/auth/view/login_view.dart lib/data/repository/account_repository_impl.dart lib/presentations/dashboard/cubit/dashboard_state.dart lib/data/services/midi_engine_service.dart lib/data/services/asset_distribution/installed_asset_store.dart lib/data/services/asset_distribution/installed_asset_store_io.dart lib/data/services/asset_distribution/installed_asset_store_web.dart lib/data/services/app_reset_service.dart lib/di/injection.dart test/auth_session_credential_test.dart test/data/services/asset_distribution_install_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: flutter test --no-pub test/auth_session_credential_test.dart test/app_reset_service_test.dart test/data/services/installed_asset_store_io_test.dart test/data/services/installed_asset_store_web_test.dart test/data/services/asset_distribution_install_test.dart test/midi_engine_contract_test.dart test/security_hygiene_test.dart

      - name: Build Web release
        run: flutter build web --release --no-pub

      - name: Commit validated changes
        run: |
          rm .github/workflows/one_shot_web_runtime_patch.yml
          rm .github/scripts/phase4_web_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Web MIDI, reset, and hosted sessions"
          git push origin HEAD:agent/cross-platform-auth-viewer-hardening
