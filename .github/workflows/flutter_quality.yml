name: Flutter Quality

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Push and pull_request events for the same PR branch should share one runner.
# Using github.ref here created separate refs (refs/heads/... vs refs/pull/...)
# and made stale duplicate suites run in parallel.
concurrency:
  group: flutter-quality-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep CI on the toolchain used for this audit so stable-channel updates
      # cannot silently change analyzer or widget-test behavior between runs.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Fail on analyzer issues
        if: steps.analyze.outcome == 'failure'
        run: exit 1
