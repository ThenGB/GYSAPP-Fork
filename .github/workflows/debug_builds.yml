name: Debug Builds (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Debug platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - windows

permissions:
  contents: read

concurrency:
  group: flutter-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android-debug:
    name: Android debug APK
    if: inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android debug
        run: flutter build apk --debug --no-pub --target-platform android-arm64

      - name: Collect Android debug
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-debug.apk dist/android/GYS-App-android-arm64-debug.apk

      - name: Upload Android debug
        uses: actions/upload-artifact@v7
        with:
          name: gys-android-debug-${{ github.sha }}
          path: dist/android/GYS-App-android-arm64-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-debug:
    name: Windows debug
    if: inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows debug
        run: flutter build windows --debug --no-pub

      - name: Collect Windows debug
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item build/windows/x64/runner/Debug/church.exe dist/windows/GYS-App-windows-debug.exe
          Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath dist/windows/GYS-App-windows-debug.zip -CompressionLevel Fastest -Force

      - name: Upload Windows debug
        uses: actions/upload-artifact@v7
        with:
          name: gys-windows-debug-${{ github.sha }}
          path: dist/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
