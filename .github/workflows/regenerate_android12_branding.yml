name: Regenerate Android 12 Branding

on:
  push:
    branches:
      - agent/church-design-system-release-pipeline
    paths:
      - '.github/workflows/regenerate_android12_branding.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/church-design-system-release-pipeline
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Generate splash resources
        run: dart run flutter_native_splash:create --path=flutter_native_splash.yaml

      - name: Verify Android 12 branding exists
        run: |
          set -euo pipefail
          find android/app/src/main/res -name android12branding.png -print
          count=$(find android/app/src/main/res -name android12branding.png | wc -l)
          test "$count" -ge 5

      - name: Commit generated branding
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate_android12_branding.yml
          git add -f android/app/src/main/res/drawable-*/android12branding.png
          git add -f android/app/src/main/res/drawable-night-*/android12branding.png
          git commit -m "Fix Android 12 branded splash resources"
          git push origin HEAD:agent/church-design-system-release-pipeline
