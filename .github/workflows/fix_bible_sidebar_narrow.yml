name: Fix Narrow Bible Sidebar

on:
  push:
    branches:
      - 'agent/app-modernization-audit'
    paths:
      - '.github/workflows/fix_bible_sidebar_narrow.yml'

permissions:
  contents: write

jobs:
  patch-sidebar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Stack compact range pickers vertically
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/presentations/bible/widgets/bible_audio_sidebar.dart')
          source = path.read_text(encoding='utf-8')
          old = '''          return Column(\n            crossAxisAlignment: CrossAxisAlignment.stretch,\n            children: [\n              buildBookPicker(),\n              const SizedBox(height: 6),\n              Row(\n                children: [\n                  Expanded(child: buildChapterPicker()),\n                  const SizedBox(width: 6),\n                  Expanded(child: buildVersePicker()),\n                ],\n              ),\n            ],\n          );'''
          new = '''          return Column(\n            crossAxisAlignment: CrossAxisAlignment.stretch,\n            children: [\n              buildBookPicker(),\n              const SizedBox(height: 6),\n              buildChapterPicker(),\n              const SizedBox(height: 6),\n              buildVersePicker(),\n            ],\n          );'''
          if old not in source:
              raise SystemExit('Expected compact picker block was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix_bible_sidebar_narrow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stack narrow Bible audio range pickers"
          git push origin HEAD:${GITHUB_REF_NAME}
