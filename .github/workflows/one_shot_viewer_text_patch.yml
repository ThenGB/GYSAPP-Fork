name: One-shot viewer text patch

on:
  push:
    branches:
      - agent/cross-platform-auth-viewer-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-platform-auth-viewer-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply source patch
        run: python .github/scripts/phase2_viewer_patch.py

      - name: Format
        run: dart format lib/presentations/song/view/song_view.dart lib/presentations/song/widgets/song_pdf_viewer.dart lib/data/services/asset_distribution/installed_asset_registry.dart lib/di/injection.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused tests
        run: flutter test --no-pub test/song/chord_text_layout_test.dart test/song_pdf_viewer_contract_test.dart test/midi_controls_layout_test.dart test/installed_asset_registry_test.dart test/source_hygiene_test.dart

      - name: Web release build
        run: flutter build web --release --no-pub

      - name: Commit validated changes
        run: |
          rm .github/workflows/one_shot_viewer_text_patch.yml
          rm .github/scripts/phase2_viewer_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize PDF modes and responsive chord text"
          git push origin HEAD:agent/cross-platform-auth-viewer-hardening
