name: One-shot viewer and text-mode hardening

on:
  push:
    branches:
      - agent/cross-platform-auth-viewer-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-platform-auth-viewer-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply viewer and lyrics fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Keep adjacent PageView pages from receiving the active song's
          # transient chord/PDF state. This removes stale/wrong chord flashes.
          song = Path('lib/presentations/song/view/song_view.dart')
          text = song.read_text(encoding='utf-8-sig')
          text = text.replace(
              "                          final songChords = state.currentChords;\n                          return RepaintBoundary(\n",
              "                          final isActiveSong = index == currentPageIndex;\n                          final songChords = isActiveSong\n                              ? state.currentChords\n                              : const <int, List<ChordData>>{};\n                          return RepaintBoundary(\n",
              1,
          )
          text = text.replace(
              "                              pdfPath: state.currentPdfPath,\n                              showChords: shouldRenderChordForSongState(state),",
              "                              pdfPath: isActiveSong ? state.currentPdfPath : null,\n                              showChords:\n                                  isActiveSong && shouldRenderChordForSongState(state),",
              1,
          )
          text = text.replace("label: 'â†“',", "label: 'Vert',")

          marker = 'class _NoteAlignedChordLine extends StatelessWidget {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('NoteAlignedChordLine marker not found')
          new_tail = r'''class _NoteAlignedChordLine extends StatelessWidget {
  final String text;
  final List<TextChordPlacement> placements;
  final TextStyle? lyricsStyle;
  final TextAlign textAlign;
  final int transposeStep;
  final int baseTransposeOffset;
  final String chordAccidentalMode;
  final double textScale;

  const _NoteAlignedChordLine({
    required this.text,
    required this.placements,
    required this.lyricsStyle,
    required this.textAlign,
    required this.transposeStep,
    required this.baseTransposeOffset,
    required this.chordAccidentalMode,
    required this.textScale,
  });

  double _measure(String value, TextStyle? style) {
    if (value.isEmpty) return 0;
    final painter = TextPainter(
      text: TextSpan(text: value, style: style),
      textDirection: ui.TextDirection.ltr,
      maxLines: 1,
    )..layout();
    return painter.width;
  }

  List<_WrappedLyricRow> _wrapRows(double maxWidth) {
    if (text.isEmpty || !maxWidth.isFinite || maxWidth <= 0) {
      return [_WrappedLyricRow(text: text, start: 0, end: text.length)];
    }

    final tokens = RegExp(r'\S+\s*').allMatches(text).toList();
    if (tokens.isEmpty) {
      return [_WrappedLyricRow(text: text, start: 0, end: text.length)];
    }

    final rows = <_WrappedLyricRow>[];
    var buffer = '';
    var rowStart = tokens.first.start;
    var rowEnd = rowStart;

    void flush() {
      if (buffer.isEmpty) return;
      final visible = buffer.trimRight();
      rows.add(
        _WrappedLyricRow(
          text: visible,
          start: rowStart,
          end: rowStart + visible.length,
        ),
      );
      buffer = '';
    }

    for (final token in tokens) {
      final value = token.group(0) ?? '';
      final candidate = '$buffer$value';
      if (buffer.isNotEmpty && _measure(candidate.trimRight(), lyricsStyle) > maxWidth) {
        flush();
        rowStart = token.start;
        buffer = value;
        rowEnd = token.end;
      } else {
        if (buffer.isEmpty) rowStart = token.start;
        buffer = candidate;
        rowEnd = token.end;
      }
    }
    flush();

    if (rows.isEmpty) {
      rows.add(_WrappedLyricRow(text: text, start: 0, end: rowEnd));
    }
    return rows;
  }

  int _characterOffsetFor(double position) {
    if (text.isEmpty) return 0;
    final painter = TextPainter(
      text: TextSpan(text: text, style: lyricsStyle),
      textDirection: ui.TextDirection.ltr,
      maxLines: 1,
    )..layout();
    if (painter.width <= 0) return 0;
    return painter
        .getPositionForOffset(Offset(position.clamp(0.0, 1.0) * painter.width, 0))
        .offset
        .clamp(0, text.length);
  }

  @override
  Widget build(BuildContext context) {
    final theme = Theme.of(context);
    final chordFontSize = (12 * textScale).clamp(9.0, 20.0);
    final chordHeight = chordFontSize + 7;
    final chordStyle = TextStyle(
      fontFamily: DesignSystem.fontHeading,
      fontSize: chordFontSize,
      fontWeight: FontWeight.w800,
      color: theme.colorScheme.onPrimaryContainer,
    );
    final alignment = switch (textAlign) {
      TextAlign.center => Alignment.center,
      TextAlign.right => Alignment.centerRight,
      _ => Alignment.centerLeft,
    };

    final labels = placements
        .map(
          (p) => _ResolvedChordPlacement(
            label: ChordService.transposeChord(
              p.chord,
              transposeStep,
              baseTransposeOffset: baseTransposeOffset,
              accidentalMode: chordAccidentalMode,
            ),
            characterOffset: _characterOffsetFor(p.safePosition),
          ),
        )
        .toList();

    return LayoutBuilder(
      builder: (context, constraints) {
        final maxWidth = constraints.maxWidth;
        if (maxWidth <= 0) return const SizedBox.shrink();
        final rows = _wrapRows(maxWidth);

        return Column(
          mainAxisSize: MainAxisSize.min,
          crossAxisAlignment: CrossAxisAlignment.stretch,
          children: [
            for (final row in rows)
              Align(
                alignment: alignment,
                child: Builder(
                  builder: (context) {
                    final rowWidth = _measure(row.text, lyricsStyle).clamp(1.0, maxWidth);
                    final rowChords = labels
                        .where(
                          (placement) =>
                              placement.characterOffset >= row.start &&
                              placement.characterOffset <= row.end,
                        )
                        .map((placement) {
                          final localEnd = (placement.characterOffset - row.start)
                              .clamp(0, row.text.length);
                          final before = row.text.substring(0, localEnd);
                          final x = _measure(before, lyricsStyle).clamp(0.0, rowWidth);
                          return (label: placement.label, x: x);
                        })
                        .toList();

                    // Preserve chord ordering and prevent badges from covering
                    // each other after a responsive wrap, matching the collision
                    // pass used by gyschordweb's lyrics viewer.
                    var previousRight = double.negativeInfinity;
                    final resolvedLefts = <double>[];
                    for (final chord in rowChords) {
                      final labelWidth = _measure(chord.label, chordStyle) + 8;
                      var left = chord.x - (labelWidth / 2);
                      left = left.clamp(0.0, (rowWidth - labelWidth).clamp(0.0, rowWidth));
                      if (left < previousRight + 4) {
                        left = (previousRight + 4).clamp(
                          0.0,
                          (rowWidth - labelWidth).clamp(0.0, rowWidth),
                        );
                      }
                      previousRight = left + labelWidth;
                      resolvedLefts.add(left);
                    }

                    return SizedBox(
                      width: rowWidth,
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          if (rowChords.isNotEmpty)
                            SizedBox(
                              height: chordHeight,
                              child: Stack(
                                clipBehavior: Clip.none,
                                children: [
                                  for (var i = 0; i < rowChords.length; i++)
                                    Positioned(
                                      left: resolvedLefts[i],
                                      top: 0,
                                      child: DecoratedBox(
                                        decoration: BoxDecoration(
                                          color: theme.colorScheme.primaryContainer
                                              .withValues(alpha: 0.62),
                                          borderRadius: BorderRadius.circular(6),
                                        ),
                                        child: Padding(
                                          padding: const EdgeInsets.symmetric(
                                            horizontal: 4,
                                            vertical: 1,
                                          ),
                                          child: Text(
                                            rowChords[i].label,
                                            style: chordStyle,
                                          ),
                                        ),
                                      ),
                                    ),
                                ],
                              ),
                            ),
                          Text(
                            row.text,
                            textAlign: textAlign,
                            style: lyricsStyle,
                            maxLines: 1,
                            softWrap: false,
                          ),
                        ],
                      ),
                    );
                  },
                ),
              ),
          ],
        );
      },
    );
  }
}

class _WrappedLyricRow {
  final String text;
  final int start;
  final int end;

  const _WrappedLyricRow({
    required this.text,
    required this.start,
    required this.end,
  });
}

class _ResolvedChordPlacement {
  final String label;
  final int characterOffset;

  const _ResolvedChordPlacement({
    required this.label,
    required this.characterOffset,
  });
}
'''
          song.write_text(text[:start] + new_tail, encoding='utf-8')

          # Preserve the pdfrx instance while layout modes change. Re-layout and
          # refit in place instead of changing the document key.
          pdf = Path('lib/presentations/song/widgets/song_pdf_viewer.dart')
          text = pdf.read_text(encoding='utf-8-sig')
          old = '''    if (oldWidget.twoPageMode != widget.twoPageMode ||\n        oldWidget.verticalScrolling != widget.verticalScrolling) {\n      // Layout changed â€” PdfViewer is rebuilt via new key on assetPath,\n      // but twoPageMode/verticalScrolling need a setState.\n      _needsInitialFit = true;\n      // Invalidate cached params so the next build creates fresh params\n      // with the correct layout mode.  Without this the old params (which\n      // may have different scrollPhysics or layoutPages) are reused.\n      _cachedParams = null;\n      setState(() {});\n    }'''
          new = '''    if (oldWidget.twoPageMode != widget.twoPageMode ||\n        oldWidget.verticalScrolling != widget.verticalScrolling) {\n      _needsInitialFit = true;\n      _cachedLayout = null;\n      _cachedLayoutKey = null;\n      _cachedParams = null;\n      setState(() {});\n      WidgetsBinding.instance.addPostFrameCallback((_) {\n        if (!mounted) return;\n        _invalidatePdfIfReady();\n        _scheduleFitWithFallback();\n      });\n    }'''
          if old not in text:
              raise SystemExit('PDF mode update block not found')
          text = text.replace(old, new, 1)
          old = '''    // Force recreation when the requested range OR the viewing mode changes\n    // so pdfrx applies initialPageNumber, rebuilds the page layout against\n    // the right pages, and re-runs the deterministic initial-fit zoom for the\n    // new mode (single/two-page/vertical).  A mode switch therefore gets a\n    // fresh, correctly-fitted viewer instead of pdfrx's onLayoutUpdate\n    // "preserve current zoom" behavior fighting the new layout.\n    final modeToken = widget.twoPageMode\n        ? '2'\n        : widget.verticalScrolling\n        ? 'v'\n        : '1';\n    final viewerKey = ValueKey(\n      '${request.sourceId}#p${request.startPage}#n${request.pageCount}#m$modeToken#v$_viewerInstance',\n    );'''
          new = '''    // Document identity stays stable across layout-mode changes. pdfrx can\n    // re-layout the same document in place, which preserves caches and avoids\n    // the visible destroy/recreate flash when switching 1/2-page or vertical.\n    final viewerKey = ValueKey(\n      '${request.sourceId}#p${request.startPage}#n${request.pageCount}#v$_viewerInstance',\n    );'''
          if old not in text:
              raise SystemExit('PDF viewer key block not found')
          pdf.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Avoid constructing a dart:io Directory inside the web DI path.
          registry = Path('lib/data/services/asset_distribution/installed_asset_registry.dart')
          text = registry.read_text(encoding='utf-8-sig')
          old = '''  InstalledAssetRegistry({\n    required Directory supportDirectory,\n    InstalledAssetStore? store,\n  }) : _supportDirectory = supportDirectory,\n       _store = store ??\n           FileSystemInstalledAssetStore(\n             installedAssetsRoot:\n                 '${supportDirectory.path}/installed_assets',\n           );\n\n  final Directory _supportDirectory;'''
          new = '''  InstalledAssetRegistry({\n    Directory? supportDirectory,\n    String? supportPath,\n    InstalledAssetStore? store,\n  }) : assert(supportDirectory != null || supportPath != null),\n       _supportPath = supportPath ?? supportDirectory!.path,\n       _store = store ??\n           FileSystemInstalledAssetStore(\n             installedAssetsRoot:\n                 '${supportPath ?? supportDirectory!.path}/installed_assets',\n           );\n\n  final String _supportPath;'''
          if old not in text:
              raise SystemExit('registry constructor not found')
          text = text.replace(old, new, 1)
          text = text.replace("Directory('${_supportDirectory.path}/installed_assets')", "Directory('$_supportPath/installed_assets')")
          registry.write_text(text, encoding='utf-8')

          injection = Path('lib/di/injection.dart')
          text = injection.read_text(encoding='utf-8-sig')
          text = text.replace(
              'supportDirectory: Directory(di<AppDirectory>().support),',
              'supportPath: di<AppDirectory>().support,',
          )
          injection.write_text(text, encoding='utf-8')

      - name: Format and validate
        run: |
          dart format lib/presentations/song/view/song_view.dart lib/presentations/song/widgets/song_pdf_viewer.dart lib/data/services/asset_distribution/installed_asset_registry.dart lib/di/injection.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub test/song/chord_text_layout_test.dart test/song_pdf_viewer_contract_test.dart test/midi_controls_layout_test.dart test/installed_asset_registry_test.dart test/source_hygiene_test.dart
          flutter build web --release --no-pub

      - name: Commit validated changes
        run: |
          rm .github/workflows/one_shot_viewer_text_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize PDF modes and responsive chord text"
          git push origin HEAD:agent/cross-platform-auth-viewer-hardening
