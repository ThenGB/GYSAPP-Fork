name: One-shot interaction and security patch

on:
  push:
    branches:
      - agent/cross-platform-auth-viewer-hardening

permissions:
  contents: write

concurrency:
  group: one-shot-interaction-security
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-platform-auth-viewer-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply targeted patches
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          dashboard = 'lib/presentations/dashboard/view/dashboard_view.dart'
          replace(
              dashboard,
              "    final colors = context.colorScheme;\n    return Padding(\n",
              "    final colors = context.colorScheme;\n    final memberType = state.account?.resolvedMemberType;\n    final branchName = state.account?.resolvedBranchName;\n    return Padding(\n",
          )
          replace(
              dashboard,
              "                if (state.isLoggedIn &&\n                    ((state.account?.memberType ?? '').isNotEmpty ||\n                        (state.account?.branchName ?? '').isNotEmpty)) ...[",
              "                if (state.isLoggedIn &&\n                    ((memberType ?? '').isNotEmpty ||\n                        (branchName ?? '').isNotEmpty)) ...[",
          )
          replace(
              dashboard,
              "                        state.account?.memberType,\n                        _formatBranchName(state.account?.branchName ?? ''),",
              "                        memberType,\n                        _formatBranchName(branchName ?? ''),",
          )
          replace(
              dashboard,
              "                  Text(\n                    'not_logged_in'.tr(),",
              "                  Text(\n                    state.isLoggedIn\n                        ? (state.account?.email?.trim().isNotEmpty == true\n                              ? state.account!.email!\n                              : 'Akun GYS')\n                        : 'not_logged_in'.tr(),",
          )

          midi = 'lib/presentations/song/widgets/draggable_midi_controls.dart'
          replace(
              midi,
              "                    return Positioned(\n                      key: const ValueKey('midi-positioned'),\n                      left: position.dx,\n                      bottom: position.dy,\n                      child: GestureDetector(\n                        onTap: _handleTap,\n                        onPanStart: _handlePanStart,\n                        onPanUpdate: _handlePanUpdate,\n                        onPanEnd: _handlePanEnd,",
              "                    final canInteractWithDock =\n                        _animationState == MidiPlayerAnimationState.sidebar_circle ||\n                        _animationState == MidiPlayerAnimationState.flying_to_sidebar;\n                    return Positioned(\n                      key: const ValueKey('midi-positioned'),\n                      left: position.dx,\n                      bottom: position.dy,\n                      child: GestureDetector(\n                        onTap: canInteractWithDock ? _handleTap : null,\n                        onPanStart: canInteractWithDock ? _handlePanStart : null,\n                        onPanUpdate: canInteractWithDock ? _handlePanUpdate : null,\n                        onPanEnd: canInteractWithDock ? _handlePanEnd : null,",
          )

          injection = 'lib/di/injection.dart'
          text = Path(injection).read_text(encoding='utf-8-sig')
          start = text.index('final InterceptorsWrapper loggingInterceptor = InterceptorsWrapper(')
          replacement = r'''final InterceptorsWrapper loggingInterceptor = InterceptorsWrapper(
            onError: (error, handler) {
              if (kDebugMode) {
                final request = error.requestOptions;
                log(
                  '${request.method} ${request.path} -> ${error.response?.statusCode ?? 'network error'}',
                  name: 'HTTP ERROR',
                );
              }
              return handler.next(error);
            },
            onRequest: (options, handler) {
              if (kDebugMode) {
                log('${options.method} ${options.path}', name: 'HTTP REQUEST');
              }
              return handler.next(options);
            },
            onResponse: (response, handler) {
              if (kDebugMode) {
                log(
                  '${response.requestOptions.method} ${response.requestOptions.path} -> ${response.statusCode}',
                  name: 'HTTP RESPONSE',
                );
              }
              return handler.next(response);
            },
          );
          '''
          Path(injection).write_text(text[:start] + replacement, encoding='utf-8')

      - name: Format and validate
        run: |
          dart format lib/domain/entity/account/account_entity.dart lib/data/repository/account_repository_impl.dart lib/presentations/dashboard/view/dashboard_view.dart lib/presentations/song/widgets/draggable_midi_controls.dart lib/di/injection.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub test/midi_controls_layout_test.dart test/modernization_hygiene_test.dart test/source_hygiene_test.dart

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/one_shot_interaction_security_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden account UI, MIDI gestures, and HTTP diagnostics"
          git push origin HEAD:agent/cross-platform-auth-viewer-hardening
