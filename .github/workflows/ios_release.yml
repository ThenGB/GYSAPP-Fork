name: iOS Release Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'ios/**'
      - 'third_party/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.metadata'
      - '.github/workflows/ios_release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  build-ios:
    name: Build iOS release without codesigning
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS release without codesigning
        run: flutter build ios --release --no-codesign --no-pub
