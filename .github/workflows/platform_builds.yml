name: Flutter Platform Builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve dependencies
        run: flutter pub get

      - name: Determine Android signing mode
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" && -n "$ANDROID_STORE_PASSWORD" ]]; then
            echo 'mode=signed' >> "$GITHUB_OUTPUT"
            echo 'Official Android signing material is available; building a signed release APK.'
          else
            echo 'mode=unsigned' >> "$GITHUB_OUTPUT"
            echo 'Official Android signing material is unavailable; building an unsigned release APK fallback.'
          fi

      - name: Configure Android release signing
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed Android release
        if: steps.signing.outputs.mode == 'signed'
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Build unsigned Android release
        if: steps.signing.outputs.mode == 'unsigned'
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Locate Android release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find build/app/outputs -type f \( -name 'app-release.apk' -o -name 'app-release-unsigned.apk' \) | head -1)"
          if [[ -z "$apk_path" ]]; then
            echo 'Unable to locate release APK output.' >&2
            find build/app/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "Located Android release APK: $apk_path"

      - name: Print APK signing certificate
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Confirm unsigned APK fallback
        if: steps.signing.outputs.mode == 'unsigned'
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if "$build_tools/apksigner" verify "${{ steps.apk.outputs.path }}" >/dev/null 2>&1; then
            echo 'Expected an unsigned fallback, but APK signature verification succeeded.' >&2
            exit 1
          fi
          echo 'Verified: fallback APK is unsigned.'

      - name: Collect Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          if [[ "${{ steps.signing.outputs.mode }}" == 'signed' ]]; then
            output_name='GYS-App-android-arm64-release.apk'
          else
            output_name='GYS-App-android-arm64-release-unsigned.apk'
          fi
          cp "${{ steps.apk.outputs.path }}" "dist/android/$output_name"
          echo "Published Android filename: $output_name"

      - name: Upload Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: gys-android-release-${{ steps.signing.outputs.mode }}-${{ github.sha }}
          path: dist/android/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ios-release:
    name: iOS release validation
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS release without codesigning
        run: flutter build ios --release --no-codesign --no-pub

  windows-release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Collect Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item build/windows/x64/runner/Release/church.exe dist/windows/GYS-App-windows-release.exe
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/windows/GYS-App-windows-release.zip -CompressionLevel Fastest -Force

      - name: Upload Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: gys-windows-release-${{ github.sha }}
          path: dist/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-main-release:
    name: Publish main build to Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - android-release
      - windows-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: gys-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="main-build-${GITHUB_RUN_NUMBER}"
          title="GYS App Main Build #${GITHUB_RUN_NUMBER} (${short_sha})"
          notes="Automated release packages from main at ${GITHUB_SHA}. Android APKs built without the official release keystore are explicitly named *-unsigned.apk and cannot update a signed Play Store installation. Windows ZIP files are the complete runnable bundles. SHA256SUMS.txt can be used to verify downloaded artifacts. Debug packages are generated only from the dedicated manual Debug Builds workflow."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              dist/*
          fi
