name: Flutter Platform Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-platform-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android release
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Collect Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/GYS-App-android-arm64-release.apk

      - name: Upload Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: gys-android-release-${{ github.sha }}
          path: dist/android/GYS-App-android-arm64-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android-debug:
    name: Android debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android debug
        run: flutter build apk --debug --no-pub --target-platform android-arm64

      - name: Collect Android debug
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-debug.apk dist/android/GYS-App-android-arm64-debug.apk

      - name: Upload Android debug
        uses: actions/upload-artifact@v7
        with:
          name: gys-android-debug-${{ github.sha }}
          path: dist/android/GYS-App-android-arm64-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ios-release:
    name: iOS release validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS release without codesigning
        run: flutter build ios --release --no-codesign --no-pub

  windows-release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Collect Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item build/windows/x64/runner/Release/church.exe dist/windows/GYS-App-windows-release.exe
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/windows/GYS-App-windows-release.zip -CompressionLevel Fastest -Force

      - name: Upload Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: gys-windows-release-${{ github.sha }}
          path: dist/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-debug:
    name: Windows debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows debug
        run: flutter build windows --debug --no-pub

      - name: Collect Windows debug
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item build/windows/x64/runner/Debug/church.exe dist/windows/GYS-App-windows-debug.exe
          Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath dist/windows/GYS-App-windows-debug.zip -CompressionLevel Fastest -Force

      - name: Upload Windows debug
        uses: actions/upload-artifact@v7
        with:
          name: gys-windows-debug-${{ github.sha }}
          path: dist/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-main-release:
    name: Publish main build to Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - android-release
      - android-debug
      - windows-release
      - windows-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: gys-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="main-build-${GITHUB_RUN_NUMBER}"
          title="GYS App Main Build #${GITHUB_RUN_NUMBER} (${short_sha})"
          notes="Automated debug and release packages from main at ${GITHUB_SHA}. Windows ZIP files are the complete runnable bundles; EXE files are attached as requested. SHA256SUMS.txt can be used to verify downloaded artifacts."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              dist/*
          fi
