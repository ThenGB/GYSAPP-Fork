name: Flutter Platform Builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-platform-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android release
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Build Android debug
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build apk --debug --no-pub --target-platform android-arm64

      - name: Collect Android packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/GYS-App-android-arm64-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk dist/android/GYS-App-android-arm64-debug.apk

      - name: Upload Android packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gys-android-${{ github.sha }}
          path: dist/android/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  ios-release:
    name: iOS release validation
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS release without codesigning
        run: flutter build ios --release --no-codesign --no-pub

  windows:
    name: Windows debug and release
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Build Windows debug
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build windows --debug --no-pub

      - name: Collect Windows packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item build/windows/x64/runner/Release/church.exe dist/windows/GYS-App-windows-release.exe
          Copy-Item build/windows/x64/runner/Debug/church.exe dist/windows/GYS-App-windows-debug.exe
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/windows/GYS-App-windows-release.zip -CompressionLevel Fastest -Force
          Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath dist/windows/GYS-App-windows-debug.zip -CompressionLevel Fastest -Force

      - name: Upload Windows packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gys-windows-${{ github.sha }}
          path: dist/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-main-release:
    name: Publish main build to Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android packages
        uses: actions/download-artifact@v4
        with:
          name: gys-android-${{ github.sha }}
          path: dist

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: gys-windows-${{ github.sha }}
          path: dist

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="main-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GYS App Main Build #${GITHUB_RUN_NUMBER} (${short_sha})" \
            --notes "Automated debug and release packages from main at ${GITHUB_SHA}. Windows ZIP files are the complete runnable bundles; EXE files are also attached for direct inspection/update workflows." \
            --prerelease \
            dist/GYS-App-android-arm64-release.apk \
            dist/GYS-App-android-arm64-debug.apk \
            dist/GYS-App-windows-release.exe \
            dist/GYS-App-windows-debug.exe \
            dist/GYS-App-windows-release.zip \
            dist/GYS-App-windows-debug.zip
