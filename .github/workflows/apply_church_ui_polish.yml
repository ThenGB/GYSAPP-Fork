name: Apply Church UI Polish

on:
  push:
    branches:
      - agent/church-design-system-release-pipeline
    paths:
      - '.github/workflows/apply_church_ui_polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/church-design-system-release-pipeline
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply consistent church UI tokens
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Keep the app's branded default explicitly named as GYS Blue.
          replace_once(
              'lib/components/themes/app_accent.dart',
              "    key: 'skyBlue',\n    label: 'Sky Blue',",
              "    key: 'skyBlue',\n    label: 'GYS Blue',",
          )

          # Expose the already-persisted SurfaceTone preference in InitialCubit.
          replace_once(
              'lib/presentations/initial/bloc/initial_cubit.dart',
              "  void changeDensity(DisplayDensity density) {\n    final updatedPrefs = state.themePreferences.copyWith(density: density);\n    emit(state.copyWith(themePreferences: updatedPrefs));\n    _saveThemePreferences();\n  }\n",
              "  void changeDensity(DisplayDensity density) {\n    final updatedPrefs = state.themePreferences.copyWith(density: density);\n    emit(state.copyWith(themePreferences: updatedPrefs));\n    _saveThemePreferences();\n  }\n\n  void changeSurfaceTone(SurfaceTone tone) {\n    final updatedPrefs = state.themePreferences.copyWith(surfaceTone: tone);\n    emit(state.copyWith(themePreferences: updatedPrefs));\n    _saveThemePreferences();\n  }\n",
          )

          settings = Path('lib/presentations/settings/view/settings_view.dart')
          text = settings.read_text(encoding='utf-8')
          old = """                    _AccentColorPicker(
                      selectedKey: state.accentKey,
                      customAccentSeed: state.themePreferences.customAccentSeed,
                      onSelected: (key, customColor) {
                        if (customColor != null) {
                          context.read<InitialCubit>().changeCustomAccentColor(
                            customColor,
                          );
                        } else {
                          context.read<InitialCubit>().changeAccentColor(key);
                        }
                      },
                    ),
                    const SizedBox(height: 16),
                    _DensitySelector(
"""
          new = """                    _AccentColorPicker(
                      selectedKey: state.accentKey,
                      customAccentSeed: state.themePreferences.customAccentSeed,
                      onSelected: (key, customColor) {
                        if (customColor != null) {
                          context.read<InitialCubit>().changeCustomAccentColor(
                            customColor,
                          );
                        } else {
                          context.read<InitialCubit>().changeAccentColor(key);
                        }
                      },
                    ),
                    const SizedBox(height: 16),
                    _SurfaceToneSelector(
                      selected: state.themePreferences.surfaceTone,
                      onChanged: context.read<InitialCubit>().changeSurfaceTone,
                    ),
                    const SizedBox(height: 16),
                    _DensitySelector(
"""
          if text.count(old) != 1:
              raise SystemExit('settings appearance insertion anchor mismatch')
          text = text.replace(old, new)

          marker = 'class _DensitySelector extends StatelessWidget {'
          selector = """class _SurfaceToneSelector extends StatelessWidget {
  const _SurfaceToneSelector({required this.selected, required this.onChanged});

  final SurfaceTone selected;
  final ValueChanged<SurfaceTone> onChanged;

  @override
  Widget build(BuildContext context) {
    return _PreferenceSelector<SurfaceTone>(
      label: 'surface_tone'.tr(),
      selected: {selected},
      onChanged: onChanged,
      segments: [
        ButtonSegment(
          value: SurfaceTone.light,
          label: Text('surface_light'.tr()),
        ),
        ButtonSegment(
          value: SurfaceTone.medium,
          label: Text('surface_medium'.tr()),
        ),
        ButtonSegment(
          value: SurfaceTone.dark,
          label: Text('surface_dark'.tr()),
        ),
      ],
    );
  }
}

"""
          if text.count(marker) != 1:
              raise SystemExit('surface selector class anchor mismatch')
          text = text.replace(marker, selector + marker)

          # Settings is a content workspace, not a decorative landing page.
          old_gradient = """      body: DecoratedBox(
        decoration: BoxDecoration(
          gradient: LinearGradient(
            begin: Alignment.topLeft,
            end: Alignment.bottomRight,
            colors: [
              context.colorScheme.surfaceContainerHighest.withValues(
                alpha: 0.2,
              ),
              context.colorScheme.surfaceContainerLow.withValues(alpha: 0.34),
              context.colorScheme.surface,
            ],
          ),
        ),
"""
          new_gradient = """      body: ColoredBox(
        color: context.colorScheme.surface,
"""
          if text.count(old_gradient) != 1:
              raise SystemExit('settings background gradient anchor mismatch')
          text = text.replace(old_gradient, new_gradient)
          text = text.replace('toolbarHeight: 74,', 'toolbarHeight: 64,', 1)
          settings.write_text(text, encoding='utf-8')

          # Home: quiet surface with a single elevated content hierarchy.
          home = Path('lib/presentations/home/view/home_view.dart')
          text = home.read_text(encoding='utf-8')
          old = """        return DecoratedBox(
          decoration: BoxDecoration(
            gradient: LinearGradient(
              begin: Alignment.topCenter,
              end: Alignment.bottomCenter,
              colors: [
                colors.surface,
                colors.surfaceContainerLowest,
                colors.surface,
              ],
              stops: const [0, 0.38, 1],
            ),
          ),
"""
          new = """        return ColoredBox(
          color: colors.surface,
"""
          if text.count(old) != 1:
              raise SystemExit('home background gradient anchor mismatch')
          text = text.replace(old, new)
          old = """            decoration: BoxDecoration(
              gradient: LinearGradient(
                begin: Alignment.topLeft,
                end: Alignment.bottomRight,
                colors: [
                  colors.primaryContainer.withValues(alpha: 0.58),
                  colors.secondaryContainer.withValues(alpha: 0.28),
                  colors.surfaceContainerLow,
                ],
              ),
"""
          new = """            decoration: BoxDecoration(
              color: colors.surfaceContainerLow,
"""
          if text.count(old) != 1:
              raise SystemExit('home welcome gradient anchor mismatch')
          text = text.replace(old, new)
          home.write_text(text, encoding='utf-8')

          # Drawer follows the same calm surface language instead of a gradient.
          dashboard = Path('lib/presentations/dashboard/view/dashboard_view.dart')
          text = dashboard.read_text(encoding='utf-8')
          old = """        child: DecoratedBox(
          decoration: BoxDecoration(
            gradient: LinearGradient(
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
              colors: [
                colors.surfaceContainerHighest.withValues(alpha: 0.75),
                colors.surface,
              ],
            ),
          ),
"""
          new = """        child: ColoredBox(
          color: colors.surface,
"""
          if text.count(old) != 1:
              raise SystemExit('drawer gradient anchor mismatch')
          text = text.replace(old, new)
          dashboard.write_text(text, encoding='utf-8')

          # Fix accidental non-existent FontWeight variants introduced while
          # consolidating shared components.
          for path in [
              'lib/components/widgets/section.dart',
              'lib/components/design_system/unified_components.dart',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('FontWeight.w750', 'FontWeight.w700')
              text = text.replace('FontWeight.w650', 'FontWeight.w600')
              p.write_text(text, encoding='utf-8')

          translations = {
              'assets/translations/id.json': {
                  'surface_tone': 'Nuansa permukaan',
                  'surface_light': 'Terang',
                  'surface_medium': 'Teduh',
                  'surface_dark': 'Dalam',
              },
              'assets/translations/en.json': {
                  'surface_tone': 'Surface tone',
                  'surface_light': 'Light',
                  'surface_medium': 'Soft',
                  'surface_dark': 'Deep',
              },
              'assets/translations/zh.json': {
                  'surface_tone': '表面色调',
                  'surface_light': '明亮',
                  'surface_medium': '柔和',
                  'surface_dark': '深色',
              },
          }
          for path, additions in translations.items():
              p = Path(path)
              data = json.loads(p.read_text(encoding='utf-8'))
              data.update(additions)
              p.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Format changed Dart files
        run: dart format lib/components lib/presentations/initial/bloc/initial_cubit.dart lib/presentations/settings/view/settings_view.dart lib/presentations/home/view/home_view.dart lib/presentations/dashboard/view/dashboard_view.dart

      - name: Commit polished UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply_church_ui_polish.yml
          git add lib assets/translations
          git commit -m "Polish church UI surfaces and customization"
          git push origin HEAD:agent/church-design-system-release-pipeline
