name: Sanitize Auth Diagnostics

on:
  push:
    branches:
      - 'agent/app-modernization-audit'
    paths:
      - '.github/workflows/sync_dependency_lock.yml'

permissions:
  contents: write

jobs:
  sanitize-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Sanitize LoginView diagnostics
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/presentations/auth/view/login_view.dart')
          source = path.read_text(encoding='utf-8')
          if 'void _authDebug(String message)' not in source:
              source = source.replace('debugPrint(', '_authDebug(')
              marker = '@RoutePage()'
              helper = '''void _authDebug(String message) {
            if (!kDebugMode) return;
            final normalized = message.toLowerCase();
            const sensitiveTerms = <String>[
              'token',
              'cookie',
              'credential',
              'response',
              'account',
              'email',
              'profile',
            ];
            if (sensitiveTerms.any(normalized.contains)) {
              debugPrint('[LoginView] Sensitive authentication diagnostic redacted');
              return;
            }
            debugPrint(message);
          }

          '''
              source = source.replace(marker, helper + marker, 1)
              path.write_text(source, encoding='utf-8')

      - name: Commit sanitized login diagnostics
        shell: bash
        run: |
          if git diff --quiet -- lib/presentations/auth/view/login_view.dart; then
            echo "Login diagnostics already sanitized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentations/auth/view/login_view.dart
          git commit -m "Sanitize authentication diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
