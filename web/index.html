<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="GYS APP — Bible, hymnal, worship, and ministry companion.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="google-signin-client_id" content="705603488262-70g3bcfan59307rrk610m32n4uhf2tge.apps.googleusercontent.com">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>GYS APP</title>

  <style id="splash-screen-style">
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #111318; }
    }
    #splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    #splash img {
      display: block;
      max-width: min(72vw, 420px);
      max-height: 72vh;
      object-fit: contain;
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById('splash')?.remove();
      document.getElementById('splash-branding')?.remove();
      document.body.style.background = 'transparent';
      document.body.style.overflow = '';
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <picture id="splash" aria-hidden="true">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <img src="splash/img/light-1x.png" alt="">
  </picture>
</body>
</html>
