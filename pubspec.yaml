  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  auto_route: ^11.1.0
  freezed_annotation: ^3.1.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  carousel_slider: ^5.0.0
  chaleno: ^0.0.6
  simple_animations: ^5.0.0+3
  hydrated_bloc: ^11.0.0
  path: ^1.8.2
  path_provider: ^2.0.14
  easy_localization: ^3.0.1
  awesome_notifications: ^0.12.1
  json_annotation: ^4.11.0
  internet_connection_checker: ^3.0.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.4.2
  sqlite3: ^3.3.2
  dartz: ^0.10.1
  collection: ^1.17.1
  cached_network_image: ^3.2.3
  rxdart: ^0.28.0
  url_launcher: ^6.1.10
  flutter_inappwebview: ^6.2.0-beta.2
  pdfrx: ^2.3.2
  google_fonts: ^8.1.0
  fluttertoast: ^10.0.0
  share_plus: ^12.0.2
  animations: ^2.0.7
  intl: ^0.20.2
  dio: ^5.1.2
  flutter_quill: ^11.5.0
  multi_split_view: ^3.5.0
  flutter_native_splash: ^2.3.1
  wakelock_plus: ^1.5.2
  flutter_tts: ^4.2.2
  easy_localization_loader: ^2.0.2
  auto_size_text: ^3.0.0
  visibility_detector: ^0.4.0+2
  timeago: ^3.5.0
  file_picker: ^11.0.2
  encrypt: ^5.0.1
  mailer: ^7.1.0
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  http: ^1.2.2
  crypto: ^3.0.6
  app_links: ^7.0.0
  archive: ^4.0.0
  dart_melty_soundfont: ^2.0.0
  flutter_soloud: ^4.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  sign_in_with_apple: ^8.1.0
  idb_shim: ^2.9.6+2
  sqflite_common_ffi_web: ^1.1.2
  sqflite_common: ^2.5.11
  edge_tts: ^0.1.5
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  device_preview: ^1.2.0
  device_preview_screenshot: ^1.0.0
  mocktail: ^1.0.0
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.5.0
  build_runner: ^2.3.3
  freezed: ^3.2.5
  json_serializable: ^6.13.2
  bloc_test: ^10.0.0
  path_provider_platform_interface: 2.1.3
  plugin_platform_interface: 2.1.8

dependency_overrides:
  dart_melty_soundfont:
    path: third_party/dart_melty_soundfont
  path_provider_foundation: 2.4.2
  flutter_inappwebview_windows:
    path: vendor/flutter_inappwebview_windows
  intl: ^0.20.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/icons/
    - assets/translations/
    - assets/data/email_report.html
    - assets/data/faith.json
    - assets/data/bible/b_tb/
    - assets/data/bible/b_tb/chapters/
    - assets/data/bible/b_tb/pericopes/
    - assets/data/index/
    - assets/data/pdf/kr/
    - assets/data/midi/
    - assets/data/midi/kr/
    - assets/data/soundfont/

flutter_assets:
  assets_path: assets/
  output_path: lib/data/utilities/variables/
  filename: assets.dart
