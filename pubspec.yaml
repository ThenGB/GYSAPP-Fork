# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/data/
    - assets/data/songs/
    - assets/data/sounds/
    - google_fonts/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Roboto
      fonts:
        - asset: google_fonts/Roboto-Thin.ttf
          weight: 100
        - asset: google_fonts/Roboto-Light.ttf
          weight: 300
        - asset: google_fonts/Roboto-Regular.ttf
          weight: 400
        - asset: google_fonts/Roboto-Medium.ttf
          weight: 500
        - asset: google_fonts/Roboto-Bold.ttf
          weight: 700
        - asset: google_fonts/Roboto-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: google_fonts/Inter-Thin.ttf
          weight: 100
        - asset: google_fonts/Inter-Light.ttf
          weight: 300
        - asset: google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: google_fonts/Inter-Bold.ttf
          weight: 700
        - asset: google_fonts/Inter-Black.ttf
          weight: 900
    - family: Lato
      fonts:
        - asset: google_fonts/Lato-Thin.ttf
          weight: 100
        - asset: google_fonts/Lato-Light.ttf
          weight: 300
        - asset: google_fonts/Lato-Regular.ttf
          weight: 400
        # - asset: google_fonts/Lato-Medium.ttf
        #   weight: 500
        - asset: google_fonts/Lato-Bold.ttf
          weight: 700
        - asset: google_fonts/Lato-Black.ttf
          weight: 900
    - family: FlowCircular
      fonts:
        - asset: google_fonts/FlowCircular-Regular.ttf
          weight: 400
    - family: Quicksand
      fonts:
        - asset: google_fonts/Quicksand-Light.ttf
          weight: 300
        - asset: google_fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: google_fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: google_fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: google_fonts/Quicksand-Bold.ttf
          weight: 700
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_assets:
  assets_path: assets/
  output_path: lib/data/utilities/variables/
  filename: assets.dart
